<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Places in Hong Kong</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --marker-red: #d71920;
      --marker-shadow: rgba(35, 22, 20, 0.22);
      --vh: 1vh;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      touch-action: none; /* Prevents iPad native scroll/bounce */
    }

    body {
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      font-family: "DM Sans", sans-serif;
      background-color: #f3eee8;
      background-image: url("./images/background.png");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      user-select: none;
      -webkit-user-select: none;
    }

    .board-stage {
      width: 100%;
      height: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background-color: transparent;
      padding: clamp(1rem, 3vw, 3.5rem);
      touch-action: none;
    }

    .board-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: rgba(255, 255, 255, 0.04);
      pointer-events: none;
    }

    /* Marker Main Container */
    .marker {
      position: absolute;
      width: clamp(63px, 9.1vw, 133px);
      aspect-ratio: 1 / 1;
      padding: 0;
      border: 0;
      background: transparent;
      filter: drop-shadow(0 12px 12px var(--marker-shadow));
      animation: settle-in 620ms cubic-bezier(.2, .8, .2, 1) both;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      will-change: transform;
    }

    .marker:focus-visible {
      outline: 4px solid #1c1917;
      outline-offset: 7px;
      border-radius: 50%;
    }

    .marker.is-dragging {
      cursor: grabbing;
      animation: none;
      z-index: 50;
    }

    /* Arrow Rotator Wrapper (ONLY rotates the arrow around the circle) */
    .arrow-rotator {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform-origin: center center;
      z-index: 0;
    }

    /* Pointer Arrow Triangle */
    .arrow-rotator::after {
      content: "";
      position: absolute;
      width: 32%;
      aspect-ratio: 1;
      left: 50%;
      bottom: -10%;
      transform: translateX(-50%) rotate(45deg);
      background: var(--marker-red);
      border-right: 3px solid var(--marker-red);
      border-bottom: 3px solid var(--marker-red);
      pointer-events: none;
    }

    /* Image Frame (STAYS FIXED - DOES NOT ROTATE) */
    .marker-frame {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 3.5px solid var(--marker-red);
      border-radius: 50%;
      background: #fff7ed;
      position: relative;
      z-index: 1;
      pointer-events: auto;
    }

    .marker-frame img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 50%;
      pointer-events: none;
      transition: transform 300ms ease;
    }

    /* Rotate Button Handle (Touch-friendly target size for iPad) */
    .rotate-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      z-index: 10;
      width: clamp(28px, 3.2vw, 38px);
      height: clamp(28px, 3.2vw, 38px);
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid var(--marker-red);
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      pointer-events: auto;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    .rotate-btn:active,
    .rotate-btn:hover {
      background-color: #fee2e2;
      transform: scale(1.15);
    }

    .rotate-btn svg {
      width: 60%;
      height: 60%;
      stroke: var(--marker-red);
      stroke-width: 2.5;
      pointer-events: none;
    }

    /* Text Label (STAYS FIXED - DOES NOT ROTATE) */
    .marker-label {
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      width: 88%;
      margin: 0;
      padding: 0.2rem 0.35rem;
      border-radius: 0.3rem;
      background: rgba(28, 25, 23, 0.88);
      color: #ffffff;
      font-size: clamp(0.58rem, 1.15vw, 0.82rem);
      font-weight: 700;
      line-height: 1.1;
      text-align: center;
      text-wrap: balance;
      pointer-events: none;
    }

    .marker:hover .marker-frame img,
    .marker:focus-visible .marker-frame img {
      transform: scale(1.06);
    }

    /* Initial Layout Positions */
    .marker-a { left: 2%; top: 5%; animation-delay: 60ms; }
    .marker-b { left: 2%; top: 28%; animation-delay: 120ms; }
    .marker-c { left: 2%; top: 51%; animation-delay: 180ms; }
    .marker-d { left: 2%; top: 74%; animation-delay: 240ms; }

    .marker-e { right: 2%; left: auto; top: 12%; animation-delay: 300ms; }
    .marker-f { right: 2%; left: auto; top: 40%; animation-delay: 360ms; }
    .marker-g { right: 2%; left: auto; top: 68%; animation-delay: 420ms; }

    @keyframes settle-in {
      from {
        opacity: 0;
        scale: 0.72;
      }
      to {
        opacity: 1;
        scale: 1;
      }
    }

    @media (max-width: 700px) {
      .board-stage {
        padding: 2rem 1.5rem 3rem;
      }

      .marker {
        width: min(25vw, 108px);
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js" type="text/javascript"></script>
</head>
<body class="w-full">
  <main class="board-stage" aria-label="Image greeting board">
    
    <!-- Marker 1 -->
    <article class="marker marker-a" tabindex="0" aria-label="The Big Buddha">
      <div class="arrow-rotator"></div>
      <div class="marker-frame">
        <img class="canva-image" loading="lazy" src="./images/big-buddha.jpg" alt="The Big Buddha">
        <p class="marker-label">The Big Buddha</p>
      </div>
      <button class="rotate-btn" aria-label="Rotate marker arrow" title="Drag to rotate arrow">
        <i data-lucide="rotate-cw"></i>
      </button>
    </article>

    <!-- Marker 2 -->
    <article class="marker marker-b" tabindex="0" aria-label="Tin Shui Wai Wetland Park">
      <div class="arrow-rotator"></div>
      <div class="marker-frame">
        <img class="canva-image" loading="lazy" src="./images/wetland-park.jpg" alt="Tin Shui Wai Wetland Park">
        <p class="marker-label">Tin Shui Wai Wetland Park</p>
      </div>
      <button class="rotate-btn" aria-label="Rotate marker arrow" title="Drag to rotate arrow">
        <i data-lucide="rotate-cw"></i>
      </button>
    </article>

    <!-- Marker 3 -->
    <article class="marker marker-c" tabindex="0" aria-label="TWSCPS">
      <div class="arrow-rotator"></div>
      <div class="marker-frame">
        <img class="canva-image" loading="lazy" src="./images/twscps.jpg" alt="TWSCPS">
        <p class="marker-label">TWSCPS</p>
      </div>
      <button class="rotate-btn" aria-label="Rotate marker arrow" title="Drag to rotate arrow">
        <i data-lucide="rotate-cw"></i>
      </button>
    </article>

    <!-- Marker 4 -->
    <article class="marker marker-d" tabindex="0" aria-label="Hong Kong Geopark">
      <div class="arrow-rotator"></div>
      <div class="marker-frame">
        <img class="canva-image" loading="lazy" src="./images/geopark.jpg" alt="Hong Kong Geopark">
        <p class="marker-label">Hong Kong Geopark</p>
      </div>
      <button class="rotate-btn" aria-label="Rotate marker arrow" title="Drag to rotate arrow">
        <i data-lucide="rotate-cw"></i>
      </button>
    </article>

    <!-- Marker 5 -->
    <article class="marker marker-e" tabindex="0" aria-label="Golden Bauhinia Square">
      <div class="arrow-rotator"></div>
      <div class="marker-frame">
        <img class="canva-image" loading="lazy" src="./images/golden-bauhinia.jpg" alt="Golden Bauhinia Square">
        <p class="marker-label">Golden Bauhinia Square</p>
      </div>
      <button class="rotate-btn" aria-label="Rotate marker arrow" title="Drag to rotate arrow">
        <i data-lucide="rotate-cw"></i>
      </button>
    </article>

    <!-- Marker 6 -->
    <article class="marker marker-f" tabindex="0" aria-label="Tai O">
      <div class="arrow-rotator"></div>
      <div class="marker-frame">
        <img class="canva-image" loading="lazy" src="./images/tai-o.jpg" alt="Tai O">
        <p class="marker-label">Tai O</p>
      </div>
      <button class="rotate-btn" aria-label="Rotate marker arrow" title="Drag to rotate arrow">
        <i data-lucide="rotate-cw"></i>
      </button>
    </article>

    <!-- Marker 7 -->
    <article class="marker marker-g" tabindex="0" aria-label="The Peak">
      <div class="arrow-rotator"></div>
      <div class="marker-frame">
        <img class="canva-image" loading="lazy" src="./images/the-peak.jpg" alt="The Peak">
        <p class="marker-label">The Peak</p>
      </div>
      <button class="rotate-btn" aria-label="Rotate marker arrow" title="Drag to rotate arrow">
        <i data-lucide="rotate-cw"></i>
      </button>
    </article>

  </main>

  <script>
    (() => {
      lucide.createIcons();

      // Viewport height fix for Safari / Mobile Chrome / iPad
      const setViewportHeight = () => {
        document.documentElement.style.setProperty("--vh", `${window.innerHeight * 0.01}px`);
      };

      setViewportHeight();
      window.addEventListener("resize", setViewportHeight);
      window.addEventListener("orientationchange", () => setTimeout(setViewportHeight, 100));

      const stage = document.querySelector(".board-stage");
      const markers = document.querySelectorAll(".marker");

      let activeDrag = null;
      let activeRotate = null;

      function stopInteraction(event) {
        if (activeDrag && (!event || event.pointerId === undefined || activeDrag.pointerId === event.pointerId)) {
          activeDrag.marker.classList.remove("is-dragging");
          activeDrag = null;
        }

        if (activeRotate && (!event || event.pointerId === undefined || activeRotate.pointerId === event.pointerId)) {
          activeRotate = null;
        }
      }

      function moveMarker(marker, left, top) {
        const stageRect = stage.getBoundingClientRect();
        const markerWidth = marker.offsetWidth;
        const markerHeight = marker.offsetHeight;
        const boundedLeft = Math.max(0, Math.min(stageRect.width - markerWidth, left));
        const boundedTop = Math.max(0, Math.min(stageRect.height - markerHeight, top));

        marker.style.left = `${boundedLeft}px`;
        marker.style.top = `${boundedTop}px`;
        marker.style.right = "auto";
        marker.style.bottom = "auto";
      }

      function applyArrowRotation(marker, angleDeg) {
        const arrow = marker.querySelector(".arrow-rotator");
        // ONLY rotate the arrow layer around the circle center
        arrow.style.transform = `rotate(${angleDeg}deg)`;
        marker.dataset.arrowRotation = angleDeg;
      }

      markers.forEach((marker) => {
        marker.dataset.arrowRotation = marker.dataset.arrowRotation || "0";
        const rotateBtn = marker.querySelector(".rotate-btn");

        // 1. ARROW ROTATION TOUCH/POINTER HANDLER
        rotateBtn.addEventListener("pointerdown", (event) => {
          if (event.button !== undefined && event.button !== 0) return;
          event.stopPropagation(); // Prevents dragging marker position
          event.preventDefault();

          const rect = marker.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;

          const currentAngle = parseFloat(marker.dataset.arrowRotation) || 0;
          const startTouchAngle = Math.atan2(event.clientY - centerY, event.clientX - centerX) * (180 / Math.PI);

          activeRotate = {
            marker,
            pointerId: event.pointerId,
            centerX,
            centerY,
            startAngle: currentAngle,
            startTouchAngle
          };

          rotateBtn.setPointerCapture(event.pointerId);
        });

        rotateBtn.addEventListener("pointermove", (event) => {
          if (!activeRotate || activeRotate.marker !== marker || activeRotate.pointerId !== event.pointerId) return;

          const currentTouchAngle = Math.atan2(event.clientY - activeRotate.centerY, event.clientX - activeRotate.centerX) * (180 / Math.PI);
          const angleDiff = currentTouchAngle - activeRotate.startTouchAngle;
          const newAngle = (activeRotate.startAngle + angleDiff) % 360;

          applyArrowRotation(marker, newAngle);
        });

        // 2. MARKER POSITION TOUCH/POINTER DRAG HANDLER
        marker.addEventListener("pointerdown", (event) => {
          if (event.button !== undefined && event.button !== 0) return;
          if (event.target.closest(".rotate-btn")) return; // Don't drag position when tapping rotate handle

          event.preventDefault();

          const rect = marker.getBoundingClientRect();
          const stageRect = stage.getBoundingClientRect();

          activeDrag = {
            marker,
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            startLeft: rect.left - stageRect.left,
            startTop: rect.top - stageRect.top
          };

          marker.style.left = `${activeDrag.startLeft}px`;
          marker.style.top = `${activeDrag.startTop}px`;
          marker.style.right = "auto";
          marker.style.bottom = "auto";
          marker.classList.add("is-dragging");
          marker.setPointerCapture(event.pointerId);
        });

        marker.addEventListener("pointermove", (event) => {
          if (!activeDrag || activeDrag.marker !== marker || activeDrag.pointerId !== event.pointerId) return;

          const dx = event.clientX - activeDrag.startX;
          const dy = event.clientY - activeDrag.startY;

          moveMarker(marker, activeDrag.startLeft + dx, activeDrag.startTop + dy);
        });

        // Touch end / Pointer release listeners
        marker.addEventListener("pointerup", stopInteraction);
        marker.addEventListener("pointercancel", stopInteraction);
        marker.addEventListener("lostpointercapture", stopInteraction);

        rotateBtn.addEventListener("pointerup", stopInteraction);
        rotateBtn.addEventListener("pointercancel", stopInteraction);
        rotateBtn.addEventListener("lostpointercapture", stopInteraction);
      });

      window.addEventListener("pointerup", stopInteraction, true);
      window.addEventListener("pointercancel", stopInteraction, true);

      // Prevent iOS Safari bounce/scroll on touch
      document.body.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
    })();
  </script>
</body>
</html>
