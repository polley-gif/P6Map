<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Places in Hong Kong</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --marker-red: #d71920;
      --marker-shadow: rgba(35, 22, 20, 0.22);
      --vh: 1vh;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      overflow: hidden;
      font-family: "DM Sans", sans-serif;
      background-color: #f3eee8;
      background-image: url("./images/background.png");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    .board-stage {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background-color: transparent;
      padding: clamp(1rem, 3vw, 3.5rem);
      touch-action: none;
    }

    .board-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: rgba(255, 255, 255, 0.04);
      pointer-events: none;
    }

  .marker {
    position: absolute;
    width: clamp(63px, 9.1vw, 133px); /* Reduced by 30% */
    aspect-ratio: 1 / 1.18;
    padding: 0;
    border: 0;
    background: transparent;
    filter: drop-shadow(0 12px 12px var(--marker-shadow));
    animation: settle-in 620ms cubic-bezier(.2, .8, .2, 1) both;
    cursor: grab;
    touch-action: none;
    user-select: none;
    will-change: transform;
  }

    .marker:focus-visible {
      outline: 4px solid #1c1917;
      outline-offset: 7px;
      border-radius: 50%;
    }

    .marker.is-dragging {
      cursor: grabbing;
      animation: none;
      z-index: 50;
    }

    .marker::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 38%;
      aspect-ratio: 1;
      left: 50%;
      bottom: 1.8%;
      transform: translateX(-50%) rotate(45deg);
      background: var(--marker-red);
      border-right: 3px solid var(--marker-red);
      border-bottom: 3px solid var(--marker-red);
    }

    .marker-frame {
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border: 3px solid var(--marker-red);
      border-radius: 50%;
      background: #fff7ed;
      position: relative;
      z-index: 1;
    }

    .marker-frame img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 50%;
      transition: transform 300ms ease;
    }

    .marker-label {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: 12%;
      transform: translateX(-50%);
      width: 88%;
      margin: 0;
      padding: 0.2rem 0.35rem;
      border-radius: 0.3rem;
      background: rgba(28, 25, 23, 0.88);
      color: #ffffff;
      font-size: clamp(0.58rem, 1.15vw, 0.82rem);
      font-weight: 700;
      line-height: 1.1;
      text-align: center;
      text-wrap: balance;
      pointer-events: none;
    }

    .marker:hover .marker-frame img,
    .marker:focus-visible .marker-frame img {
      transform: scale(1.06);
    }

/* Left side markers (4 items spaced vertically) */
.marker-a { left: 2%; top: 5%; transform: rotate(-8deg); animation-delay: 60ms; }
.marker-b { left: 2%; top: 28%; transform: rotate(6deg); animation-delay: 120ms; }
.marker-c { left: 2%; top: 51%; transform: rotate(-4deg); animation-delay: 180ms; }
.marker-d { left: 2%; top: 74%; transform: rotate(8deg); animation-delay: 240ms; }

/* Right side markers (3 items spaced vertically) */
.marker-e { right: 2%; left: auto; top: 12%; transform: rotate(5deg); animation-delay: 300ms; }
.marker-f { right: 2%; left: auto; top: 40%; transform: rotate(-7deg); animation-delay: 360ms; }
.marker-g { right: 2%; left: auto; top: 68%; transform: rotate(5deg); animation-delay: 420ms; }

    @keyframes settle-in {
      from {
        opacity: 0;
        scale: 0.72;
      }
      to {
        opacity: 1;
        scale: 1;
      }
    }

    @media (max-width: 700px) {
      body {
        overflow-y: auto;
      }

      .board-stage {
        min-height: calc(100 * min(var(--vh, 1vh), 1vh));
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-content: center;
        gap: 1.7rem 1.2rem;
        padding: 2rem 1.5rem 3rem;
        touch-action: pan-y;
      }

      .marker {
        width: min(25vw, 108px);
        position: relative;
        inset: auto;
        justify-self: center;
      }

      .marker.is-dragging {
        position: absolute;
      }

      .marker-a { transform: rotate(-7deg); }
      .marker-b { transform: rotate(6deg); }
      .marker-c { transform: rotate(-4deg); }
      .marker-d { transform: rotate(7deg); }
      .marker-e { transform: rotate(4deg); }
      .marker-f { transform: rotate(-6deg); }

      .marker-g {
        transform: rotate(5deg);
        grid-column: 1 / -1;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js" type="text/javascript"></script>
</head>
<body class="w-full">
  <main class="board-stage" aria-label="Image greeting board">
    <article class="marker marker-a" tabindex="0" aria-label="Image marker one">
      <div class="marker-frame">
        <img class="canva-image" loading="lazy" src="./images/big-buddha.jpg" alt="The Big Buddha">
        <p class="marker-label canva-text" style="color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 16px;">The Big Buddha</p>
      </div>
    </article>
    <article class="marker marker-b" tabindex="0" aria-label="Image marker two">
      <div class="marker-frame">
        <img class="canva-image" loading="lazy" src="./images/wetland-park.jpg" alt="Tin Shui Wai Wetland Park">
        <p class="marker-label canva-text" style="color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 16px;">Tin Shui Wai Wetland Park</p>
      </div>
    </article>
    <article class="marker marker-c" tabindex="0" aria-label="Image marker three">
      <div class="marker-frame">
        <img class="canva-image" loading="lazy" src="./images/twscps.jpg" alt="TWSCPS">
        <p class="marker-label canva-text" style="color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 16px;">TWSCPS</p>
      </div>
    </article>
    <article class="marker marker-d" tabindex="0" aria-label="Image marker four">
      <div class="marker-frame">
        <img class="canva-image" loading="lazy" src="./images/geopark.jpg" alt="Hong Kong Geopark">
        <p class="marker-label canva-text" style="color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 16px;">Hong Kong Geopark</p>
      </div>
    </article>
    <article class="marker marker-e" tabindex="0" aria-label="Image marker five">
      <div class="marker-frame">
        <img class="canva-image" loading="lazy" src="./images/golden-bauhinia.jpg" alt="Golden Bauhinia Square">
        <p class="marker-label canva-text" style="color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 16px;">Golden Bauhinia Square</p>
      </div>
    </article>
    <article class="marker marker-f" tabindex="0" aria-label="Image marker six">
      <div class="marker-frame">
        <img class="canva-image" loading="lazy" src="./images/tai-o.jpg" alt="Tai O">
        <p class="marker-label canva-text" style="color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 16px;">Tai O</p>
      </div>
    </article>
    <article class="marker marker-g" tabindex="0" aria-label="Image marker seven">
      <div class="marker-frame">
        <img class="canva-image" loading="lazy" src="./images/the-peak.jpg" alt="The Peak">
        <p class="marker-label canva-text" style="color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 16px;">The Peak</p>
      </div>
    </article>
  </main>
  <script>
    (() => {
      const setViewportHeight = () => {
        document.documentElement.style.setProperty("--vh", `${window.innerHeight * 0.01}px`);
      };

      setViewportHeight();
      window.addEventListener("resize", setViewportHeight);

      const stage = document.querySelector(".board-stage");
      const markers = document.querySelectorAll(".marker");
      let active = null;
      let framePending = false;
      let latestEvent = null;

      function stopInteraction(event) {
        if (!active) return;
        if (event && event.pointerId !== undefined && active.pointerId !== event.pointerId) return;

        if (active.raf) cancelAnimationFrame(active.raf);

        const marker = active.marker;
        marker.classList.remove("is-dragging");
        active = null;
        latestEvent = null;
        framePending = false;
      }

      function moveMarker(marker, left, top) {
        const stageRect = stage.getBoundingClientRect();
        const markerWidth = marker.offsetWidth;
        const markerHeight = marker.offsetHeight;
        const boundedLeft = Math.max(0, Math.min(stageRect.width - markerWidth, left));
        const boundedTop = Math.max(0, Math.min(stageRect.height - markerHeight, top));

        marker.style.left = `${boundedLeft}px`;
        marker.style.top = `${boundedTop}px`;
        marker.style.right = "auto";
        marker.style.bottom = "auto";
      }

      markers.forEach((marker) => {
        marker.addEventListener("pointerdown", (event) => {
          if (event.button !== 0) return;

          event.preventDefault();

          const rect = marker.getBoundingClientRect();
          const stageRect = stage.getBoundingClientRect();

          active = {
            marker,
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            startLeft: rect.left - stageRect.left,
            startTop: rect.top - stageRect.top,
            markerWidth: marker.offsetWidth,
            markerHeight: marker.offsetHeight,
            stageWidth: stageRect.width,
            stageHeight: stage.clientHeight,
            raf: null
          };

          marker.style.left = `${active.startLeft}px`;
          marker.style.top = `${active.startTop}px`;
          marker.style.right = "auto";
          marker.style.bottom = "auto";
          marker.classList.add("is-dragging");
          marker.setPointerCapture(event.pointerId);
        });

        marker.addEventListener("pointermove", (event) => {
          if (!active || active.marker !== marker || active.pointerId !== event.pointerId) return;

          latestEvent = event;

          if (framePending) return;
          framePending = true;

          active.raf = requestAnimationFrame(() => {
            if (!active || !latestEvent) {
              framePending = false;
              return;
            }

            const dx = latestEvent.clientX - active.startX;
            const dy = latestEvent.clientY - active.startY;

            moveMarker(marker, active.startLeft + dx, active.startTop + dy);
            framePending = false;
          });
        });

        marker.addEventListener("pointerup", stopInteraction);
        marker.addEventListener("pointercancel", stopInteraction);
        marker.addEventListener("lostpointercapture", stopInteraction);

        marker.addEventListener("keydown", (event) => {
          if (window.innerWidth <= 700) return;

          const directions = {
            ArrowLeft: [-12, 0],
            ArrowRight: [12, 0],
            ArrowUp: [0, -12],
            ArrowDown: [0, 12]
          };

          if (!directions[event.key]) return;

          event.preventDefault();

          const markerRect = marker.getBoundingClientRect();
          const stageRect = stage.getBoundingClientRect();
          const [xStep, yStep] = directions[event.key];

          moveMarker(
            marker,
            markerRect.left - stageRect.left + xStep,
            markerRect.top - stageRect.top + yStep
          );
        });
      });

      window.addEventListener("pointerup", stopInteraction, true);
      window.addEventListener("pointercancel", stopInteraction, true);
    })();
  </script>
</body>
</html>
